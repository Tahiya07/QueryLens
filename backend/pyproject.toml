[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querylens-api"
version = "0.1.0"
description = "Local-first natural language data analyst"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]==0.34.2", "pydantic==2.11.4",
  "pandas==2.2.3", "numpy==2.2.5", "scipy==1.15.3", "scikit-learn==1.6.1",
  "duckdb==1.2.2", "openpyxl==3.1.5", "xlrd==2.0.1", "python-multipart==0.0.20",
  "passlib[bcrypt]==1.7.4", "bcrypt==4.0.1", "PyJWT==2.10.1", "reportlab==4.4.1", "email-validator==2.2.0",
  "SQLAlchemy==2.0.41", "psycopg[binary]==3.2.9"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
